<div id="sm-admin-container" class="sm-admin-container">
  <iframe
    *ngIf="ready(); else status"
    class="sm-admin-frame"
    src="/_admin/ui-embedded"
    title="Secrets Manager"
  ></iframe>

  <ng-template #status>
    <p class="sm-admin-status" [class.sm-admin-error]="error()">
      {{ error() || "Loading Secrets Manager..." }}
    </p>
  </ng-template>
</div>
